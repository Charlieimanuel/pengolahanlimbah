name: Keep-Alive Supabase

on:
  schedule:
    # Berjalan otomatis setiap 3 hari sekali pada jam 07:00 UTC (15:00 WITA)
    - cron: "0 7 */3 * *"
  workflow_dispatch: # Memungkinkan tombol 'Run workflow' manual di GitHub Actions

jobs:
  ping-supabase:
    name: Ping Supabase Database
    runs-on: ubuntu-latest
    steps:
      - name: Kirim Ping Request ke REST API Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::error::SUPABASE_URL atau SUPABASE_ANON_KEY belum dikonfigurasi di GitHub Repository Secrets!"
            echo "Silakan buka: Settings -> Secrets and variables -> Actions -> New repository secret"
            exit 1
          fi

          echo "Mengirim ping keep-alive ke Supabase Cloud..."
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" \
            -X GET "${SUPABASE_URL}/rest/v1/b3_tickets?select=id&limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "Status HTTP Response: $HTTP_STATUS"

          if [ "$HTTP_STATUS" -ge 200 ] && [ "$HTTP_STATUS" -lt 300 ]; then
            echo "✅ Berhasil! Database Supabase terdeteksi aktif dan timer 7 hari berhasil di-reset."
          else
            echo "::warning::Menerima respons HTTP $HTTP_STATUS saat menghubungi Supabase."
            cat response.json
          fi

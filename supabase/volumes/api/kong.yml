_format_version: '2.1'
_transform: true

services:
  - name: auth-v1
    url: http://auth:9999/
    routes:
      - name: auth-v1-all
        strip_path: true
        paths:
          - /auth/v1/

  - name: rest-v1
    url: http://rest:3000/
    routes:
      - name: rest-v1-all
        strip_path: true
        paths:
          - /rest/v1/

  - name: storage-v1
    url: http://storage:5000/
    routes:
      - name: storage-v1-all
        strip_path: true
        paths:
          - /storage/v1/

  - name: meta-v1
    url: http://meta:8080/
    routes:
      - name: meta-v1-all
        strip_path: true
        paths:
          - /pg/

  - name: studio
    url: http://studio:3000/
    routes:
      - name: studio-all
        strip_path: false
        paths:
          - /

plugins:
  - name: cors
    config:
      origins:
        - "http://localhost:3000"
        - "*"
      methods:
        - GET
        - POST
        - PUT
        - PATCH
        - DELETE
        - OPTIONS
      headers:
        - authorization
        - content-type
        - apikey
        - x-client-info
        - x-supabase-api-version
        - cache-control
        - x-upsert
        - prefer
        - range
        - if-match
        - if-none-match
        - accept
        - accept-profile
        - content-profile
      exposed_headers:
        - content-range
        - x-total-count
        - content-length
        - content-type
      credentials: true
      max_age: 3600
